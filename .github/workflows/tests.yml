name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versions:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.stability }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        stability: [prefer-lowest, prefer-stable]
        include:
          - laravel: '12'
            testbench: '^10.6'
          - laravel: '13'
            testbench: '^11.0'

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ matrix.stability }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-update --no-interaction
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress

      - name: Installed versions
        run: composer show | grep -E '^(laravel/framework|orchestra/testbench|phpunit/phpunit|pestphp/pest) '

      - name: Run tests
        run: vendor/bin/pest --ci

  databases:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL 8.0
            image: mysql:8.0
            connection: mysql
            port: 3306
            username: root
            health: --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword" --health-interval=5s --health-timeout=5s --health-retries=20
          - name: MySQL 8.4
            image: mysql:8.4
            connection: mysql
            port: 3306
            username: root
            health: --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword" --health-interval=5s --health-timeout=5s --health-retries=20
          - name: MariaDB 10.11
            image: mariadb:10.11
            connection: mariadb
            port: 3306
            username: root
            health: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
          - name: MariaDB 11.4
            image: mariadb:11.4
            connection: mariadb
            port: 3306
            username: root
            health: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
          - name: PostgreSQL 14
            image: postgres:14
            connection: pgsql
            port: 5432
            username: postgres
            health: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
          - name: PostgreSQL 17
            image: postgres:17
            connection: pgsql
            port: 5432
            username: postgres
            health: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20

    services:
      database:
        image: ${{ matrix.image }}
        # Each image only reads its own variables and ignores the others.
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
          MARIADB_ROOT_PASSWORD: password
          MARIADB_DATABASE: testing
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testing
        ports:
          - 3306:3306
          - 5432:5432
        options: ${{ matrix.health }}

    env:
      DB_CONNECTION: ${{ matrix.connection }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: testing
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: password

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-8.4-13-prefer-stable-${{ hashFiles('composer.json') }}
          restore-keys: composer-8.4-13-prefer-stable-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:^13.0" "orchestra/testbench:^11.0" --dev --no-update --no-interaction
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci
