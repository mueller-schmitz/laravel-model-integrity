name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  static-analysis:
    uses: ./.github/workflows/static-analysis.yml

  release:
    name: Create GitHub release
    needs: [tests, static-analysis]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The section ends at the next version heading or at the link
          # reference definitions at the end of the file.
          awk -v heading="## [${version}]" '
            index($0, heading) == 1 { found = 1; next }
            found && (index($0, "## [") == 1 || $0 ~ /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::No changelog section found for ${version}"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-alpha*|*-beta*|*-rc*) prerelease=(--prerelease) ;;
          esac

          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag \
            "${prerelease[@]}"
